background {
    path = /home/live/Backgrounds/Archcosta.jpg
    blur_passes = 4
    blur_size = 6
    contrast = 1.4
    noise = 0.02
    brightness = 0.7
    vibrancy = 0.6
}

general { }

input-field {
    size = 200, 35
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.5
    dots_center = true
    outer_color = rgba(192, 86, 139, 0.6)
    inner_color = rgba(37, 24, 72, 0.4)
    font_color = rgb(224, 208, 232)
    fade_on_empty = false
    font_family = JetBrains Mono
    placeholder_text = Enter password...
    fail_text = $PAMFAIL
    hide_input = false
    position = 0, -360
    halign = center
    valign = center
}

label {
    text = $TIME
    color = rgba(224,208,232,0.9)
    font_size = 220
    font_family = JetBrains Mono
    position = 0, 220
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +"%A")"
    color = rgba(242,114,154,1.0)
    font_size = 60
    font_family = JetBrains Mono
    position = 0,220
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +"%d %B %Y")"
    color = rgba(224,208,232,1.0)
    font_size = 34
    font_family = JetBrains Mono
    position = 0,-10
    halign = center
    valign = center
}

label {
    text = Hello, $USER
    color = rgba(224, 208, 232, 1.0)
    font_size = 30
    font_family = JetBrains Mono
    position = 0, -280
    halign = center
    valign = center
}
