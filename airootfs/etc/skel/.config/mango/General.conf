# Border settings
borderpx=2
border_radius=2
no_radius_when_single=0
no_border_when_single=0

# Overview settings
enable_hotarea=0
hotarea_size=10
ov_tab_mode=0
overviewgappi=5
overviewgappo=30
hotarea_corner=0

# Keyboard related
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Touchpad settings
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1
trackpad_scroll_factor=2.0

# Mouse Settings
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=1.0
axis_scroll_factor=2.0

# Focus & Input
drag_tile_to_tile=1
warpcursor=0
cursor_hide_timeout=5
drag_corner=4
focus_on_activate=1
sloppyfocus=1
enable_floating_snap=0
snap_distance=30

# Cursor Theme
cursor_theme=Adwaita
cursor_size=24

# Gaps
gappih=3
gappiv=3
gappoh=5
gappov=5

# Theming
rootcolor=0x1a1025ff
maximizescreencolor=0x251848ff
urgentcolor=0xf2729aff
globalcolor=0x7b4178ff
scratchpadcolor=0x251848ff
overlaycolor=0xe0d0e8ff
focuscolor=0xc0568bff
bordercolor=0x00000000

focused_opacity=1.0
unfocused_opacity=1.0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Misc
allow_tearing=2
syncobj_enable=1
axis_bind_apply_timeout=100
idleinhibit_ignore_visible=0
focus_cross_monitor=0
focus_cross_tag=0
